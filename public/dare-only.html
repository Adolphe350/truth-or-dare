<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dare Only 😈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">

    <div class="screen active" id="s-welcome">
        <div class="logo">😈</div>
        <h1>Dare Only</h1>
        <p class="subtitle">Challenges only — no questions</p>
        <div class="mode-select">
            <div class="mode-btn" id="mode-same" onclick="pick('same')"><div class="icon">📱</div><div class="label">Same Phone</div></div>
            <div class="mode-btn" id="mode-diff" onclick="pick('diff')"><div class="icon">📱📱</div><div class="label">Two Phones</div></div>
        </div>
        <a href="/" class="back-link">← All games</a>
    </div>

    <div class="screen" id="s-same">
        <div class="logo">📱</div>
        <h1>Enter names</h1>
        <input type="text" id="p1" placeholder="Player 1 name…" maxlength="20">
        <input type="text" id="p2" placeholder="Player 2 name…" maxlength="20">
        <button class="btn btn-primary" onclick="startSame()">Let's go 😈</button>
        <a href="/" class="back-link">← Back</a>
    </div>

    <div class="screen" id="s-diff">
        <div class="logo">📱📱</div>
        <h1>Two Phones</h1>
        <input type="text" id="my-name" placeholder="Your name…" maxlength="20">
        <button class="btn btn-primary" onclick="createRoom()">Create Room</button>
        <div class="divider"><span>or join</span></div>
        <input type="text" id="code-input" placeholder="Room code…" maxlength="6"
               style="text-transform:uppercase;text-align:center;letter-spacing:6px;font-size:1.5rem;font-weight:800;">
        <button class="btn btn-secondary" onclick="joinRoom()">Join</button>
        <div class="error-msg" id="err"></div>
        <a href="/" class="back-link">← Back</a>
    </div>

    <div class="screen" id="s-wait">
        <div class="logo">⏳</div>
        <h1>Waiting…</h1>
        <div class="room-code">
            <div class="label">Share this code</div>
            <div class="code" id="room-code">------</div>
            <button class="copy-btn" id="copy-btn" onclick="copyCode()">📋 Copy</button>
        </div>
        <div class="players-list" id="players"></div>
        <p class="waiting-text" id="wait-text">Waiting for second player…</p>
        <button class="btn btn-primary" id="start-btn" style="display:none" onclick="startGame()">Start! 😈</button>
    </div>

    <div class="screen" id="s-game">
        <div class="question-card" id="q-card">
            <div class="target" id="q-label">DARE FOR</div>
            <div class="player-name" id="q-player"></div>
            <span class="type-badge type-dare">😈 DARE</span>
            <div class="text" id="q-text">Generating…</div>
        </div>
        <div class="confirmation-bar">
            <div class="confirmation-dot" id="dot1"></div>
            <div class="confirmation-dot" id="dot2"></div>
            <span id="conf-label">Both tap Next</span>
        </div>
        <button class="btn btn-confirm" id="next-btn" onclick="tapNext()">Next ➡️</button>
    </div>

</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(), lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('dare-lang')||'en';
let roomId,myName,confirmed=false,sameDevice=false;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function pick(m){document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('selected'));$(`mode-${m}`).classList.add('selected');setTimeout(()=>show(m==='same'?'s-same':'s-diff'),200);}
function startSame(){const p1=$('p1').value.trim(),p2=$('p2').value.trim();if(!p1||!p2)return;sameDevice=true;myName=p1;socket.emit('create-room',{name:p1,sameDevice:true,gameType:'dare-only',lang});socket.once('room-created',d=>{roomId=d.roomId;socket.emit('same-device-mode',{name2:p2});});}
function createRoom(){const n=$('my-name').value.trim();if(!n)return;myName=n;socket.emit('create-room',{name:n,gameType:'dare-only',lang});}
function joinRoom(){const n=$('my-name').value.trim(),c=$('code-input').value.trim().toUpperCase();if(!n||!c)return;myName=n;socket.emit('join-room',{roomId:c,name:n});}
function copyCode(){navigator.clipboard.writeText($('room-code').textContent);$('copy-btn').textContent='✅ Copied!';setTimeout(()=>$('copy-btn').textContent='📋 Copy',2000);}
function startGame(){socket.emit('start-game',{});$('start-btn').innerHTML='<span class="loading"></span>';}
function tapNext(){if(confirmed&&!sameDevice)return;confirmed=true;$('next-btn').classList.add('confirmed');$('next-btn').textContent='✅';socket.emit('confirm-next',{});}
socket.on('room-created',d=>{roomId=d.roomId;$('room-code').textContent=d.roomId;renderP(d.players);if(!sameDevice)show('s-wait');});
socket.on('player-joined',d=>{renderP(d.players);if(d.players.length>=2){$('wait-text').textContent='Both here! 🎉';$('start-btn').style.display='block';if(sameDevice){show('s-wait');setTimeout(startGame,400);}}});
socket.on('player-left',d=>{renderP(d.players);$('start-btn').style.display='none';});
socket.on('new-question',d=>{show('s-game');confirmed=false;const c=$('q-card');c.style.animation='none';requestAnimationFrame(()=>{c.style.animation='cardIn 0.5s cubic-bezier(.22,1,.36,1) both';});$('q-player').textContent=d.targetPlayer;$('q-text').textContent=d.question.replace(/^(DARE:|ACTION:)\s*/i,'');$('next-btn').classList.remove('confirmed');$('next-btn').textContent='Next ➡️';$('dot1').classList.remove('active');$('dot2').classList.remove('active');$('conf-label').textContent=sameDevice?'Tap Next':'Both tap Next';});
socket.on('confirmation-update',d=>{if(d.confirmations>=1)$('dot1').classList.add('active');if(d.confirmations>=2)$('dot2').classList.add('active');});
socket.on('error',d=>{$('err').textContent=d.message;setTimeout(()=>$('err').textContent='',3000);});
function renderP(p){$('players').innerHTML=p.map(x=>`<span class="player-tag">👤 ${x.name}</span>`).join('');}
</script>
</body>
</html>
